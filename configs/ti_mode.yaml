# Titanium mode (UTriage-Ti): structured grain noise and zone-wise reference calibration.
# Everything produced with this file is SYNTHETIC DATA.
# !!! ALL VALUES ARE PLACEHOLDERS OR SIMULATOR MODEL CHOICES !!!
# None is taken from AMS 2631, ASTM E2375 or any other standard. Those standards are paywalled and
# must not be reproduced from memory. Ruri must check every value against a legitimate copy of the
# applicable specification and class, then change `status` below.
status: "PLACEHOLDER - UNVERIFIED - Ruri to check"
source: "UNVERIFIED - Ruri to check (model choices so the simulator and calibration run)"

noise:
  # Macrozone-like spatial correlation of grain-noise strength (simulator model choice, not measured).
  corr_axial_mm: 6.0            # Gaussian correlation length along the bar axis
  corr_angle_deg: 15.0          # Gaussian correlation length around the circumference
  field_sigma: 0.1              # std of the log of the noise-strength multiplier (changed from 0.4 after the
                                # first calibration run: at >= 0.15 no zone was inspectable; see ADR 0016 note)
  # Depth zones (metal depth below the entry surface, mm) and their relative noise level.
  zone_edges_mm: [2.0, 12.0, 22.0, 36.0]
  zone_levels: [1.0, 1.2, 1.1]  # model choice: noisier mid-section; NOT a measured profile (was [1.0, 1.6, 1.3])

calibration:
  ref_fbh_mm: 0.8               # reference flat-bottom-hole diameter, UNVERIFIED - Ruri to check
  signal_window_px: 1           # signal A = mean of the NxN C-scan pixels centred on the hole's peak; 1 because the
                                # simulator grid (1 mm x 3 deg) is coarser than the beam, so a 3x3 mean cut A to ~1/3
  noise_exclude_px: 6           # pixels around each reference hole excluded from the noise region
  noise_margin: 0.10            # alarm candidate = peak noise C x (1 + noise_margin), placeholder
  cap_fraction: 0.70            # alarm never above this x reference response A, UNVERIFIED - Ruri to check
  min_snr: 2.0                  # zone below this SNR is not inspectable at this sensitivity, placeholder
  block_seed: 1000              # seed of the simulated reference block
